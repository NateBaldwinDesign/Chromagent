<!doctype html>
<!--
  Personalized colors with Chromagentic. Copy scripts/chromagentic-runtime.mjs next to this file
  (or import "chromagentic/runtime" when the npm package is installed). The static CSS from
  `chromagentic generate` stays loaded as the fallback; personal choices override it inline.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="colors.css" />
  </head>
  <body style="background: var(--color-background); color: var(--color-text)">
    <label>Background lightness <input id="lightness" type="range" min="0" max="1" step="0.01" /></label>
    <label>Contrast <input id="contrast" type="range" min="0.5" max="2" step="0.1" /></label>
    <button id="reset">Use my system settings</button>
    <script type="module">
      import { personalize } from "./chromagentic-runtime.mjs";
      // The same settings used for the static CSS (chromagentic.theme.json).
      const config = { colors: { gray: "#6b7280", brand: "#2563eb" }, background: { color: "gray" } };
      const KEY = "chromagentic-personal";
      const saved = JSON.parse(localStorage.getItem(KEY) ?? "null");
      const lightness = document.getElementById("lightness");
      const contrast = document.getElementById("contrast");
      lightness.value = saved?.backgroundLightness ?? 1;
      contrast.value = saved?.contrast ?? 1;
      if (saved) personalize(config, saved);
      const update = () => {
        const choice = { backgroundLightness: Number(lightness.value), contrast: Number(contrast.value) };
        localStorage.setItem(KEY, JSON.stringify(choice));
        personalize(config, choice);
      };
      lightness.addEventListener("input", update);
      contrast.addEventListener("input", update);
      document.getElementById("reset").addEventListener("click", () => {
        localStorage.removeItem(KEY);
        location.reload(); // drops the inline overrides so the static schemes apply again
      });
    </script>
  </body>
</html>
