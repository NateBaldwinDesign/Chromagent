name: Release
# Runs when a version tag is pushed (`npm version minor && git push origin main --tags`).
# Publishes to npm with trusted publishing (no token; set it up once at npmjs.com → package → Settings →
# Trusted publisher → GitHub Actions, workflow file `release.yml`), attests the skill bundles, and creates
# a GitHub Release from the matching CHANGELOG section.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Tag matches every version number
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match package.json version $version."
            exit 1
          fi
          node scripts/sync-version.mjs
          if [ -n "$(git status --porcelain)" ]; then
            git --no-pager diff
            echo "The plugin or skill version is out of sync. Run npm run version and commit the result."
            exit 1
          fi
          if ! grep -q "^## $version\$" CHANGELOG.md; then
            echo "CHANGELOG.md has no '## $version' section."
            exit 1
          fi
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Skill bundle is up to date
        run: |
          if [ -n "$(git status --porcelain -- skills/)" ]; then
            git status --porcelain -- skills/
            echo "The skill bundle is out of date. Run npm run build and commit the result."
            exit 1
          fi
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: skills/chromagentic/scripts/*.mjs
      - name: Publish to npm
        run: npm publish --provenance --access public
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v h="## $version" '$0 == h { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
