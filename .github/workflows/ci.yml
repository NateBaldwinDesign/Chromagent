name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - name: Skill bundle is up to date
        run: |
          if [ -n "$(git status --porcelain -- skills/)" ]; then
            git status --porcelain -- skills/
            echo "The skill bundle is out of date. Run npm run build and commit the result."
            exit 1
          fi
      - name: Skill bundle runs on its own
        run: |
          cp -r skills/chromagentic "$RUNNER_TEMP/chromagentic"
          cd "$RUNNER_TEMP"
          node chromagentic/scripts/chromagentic.mjs --version
          node chromagentic/scripts/chromagentic.mjs generate chromagentic/assets/example-all-modes.json --strict > /dev/null
          node --input-type=module -e "import('./chromagentic/scripts/chromagentic-runtime.mjs').then(m => { if (!m.personalizedVariables({ colors: { brand: '#2563eb' } }, {})['--color-text']) process.exit(1) })"
  skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install "git+https://github.com/agentskills/agentskills@83021e2be457a9b6679148719c1f6074f0ad975e#subdirectory=skills-ref"
      - run: skills-ref validate ./skills/chromagentic
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Claude Code plugin and marketplace are valid
        run: |
          npx -y @anthropic-ai/claude-code@2.1.330 plugin validate .
          npx -y @anthropic-ai/claude-code@2.1.330 plugin validate .claude-plugin/marketplace.json
