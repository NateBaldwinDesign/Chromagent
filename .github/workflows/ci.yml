name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - name: Skill bundle is up to date
        run: git diff --exit-code -- skills/
      - name: Skill bundle runs on its own
        run: |
          cp -r skills/chromagent "$RUNNER_TEMP/chromagent"
          cd "$RUNNER_TEMP"
          node chromagent/scripts/chromagent.mjs --version
          node chromagent/scripts/chromagent.mjs generate chromagent/assets/example-all-modes.json --strict > /dev/null
  skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "git+https://github.com/agentskills/agentskills#subdirectory=skills-ref"
      - run: skills-ref validate ./skills/chromagent
