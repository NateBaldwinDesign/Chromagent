id: button-states
fixture: compose
prompt: Build a button with all its states.
expectReferences: [semantic-roles.md, scales.md, engine.md]
rubric: Interactive states (default, hover or pressed, focused) should step up evenly from the accent role (hover, pressed, focus); a neutral (gray) disabled state is fine. Disabled controls are exempt from WCAG contrast rules, but focus indicators need at least 3:1. This is an Android Compose app, so colors should be Display P3.
