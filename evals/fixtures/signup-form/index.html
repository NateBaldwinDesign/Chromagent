<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Join Orbit</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="signup">
      <h1>Create your Orbit account</h1>
      <p class="info-message">You can invite your team after you sign up.</p>
      <form>
        <label for="email">Email</label>
        <input id="email" class="field" type="email" value="sam@" />
        <p class="error-message">Enter a full email address, like sam@example.com.</p>
        <label for="password">Password</label>
        <input id="password" class="field" type="password" value="hunter2" />
        <p class="warning-message">This password is weak. Try a longer one.</p>
        <label for="name">Display name</label>
        <input id="name" class="field" type="text" value="Sam" />
        <p class="success-message">That name is available.</p>
        <button class="button" type="submit">Sign up</button>
      </form>
    </main>
  </body>
</html>
